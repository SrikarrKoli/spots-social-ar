[project]
name = "locus-ar-social"
version = "0.1.0"
description = "Hackathon MVP for camera-aware conversations and notes on enrolled objects"
requires-python = ">=3.11,<3.13"
dependencies = [
  "en-core-web-sm",
  "fastapi==0.115.6",
  "faster-whisper>=1.2.1",
  "httpx==0.28.1",
  "murmurhash==1.0.13",
  "numpy==2.1.3",
  "opencv-contrib-python-headless==4.10.0.84",
  "preshed==3.0.10",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
  "spacy==3.8.7",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
voice = [
    "kokoro>=0.9.4",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "performance: opt-in machine-sensitive performance benchmark",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
