[project]
name = "locus-ar-social"
version = "0.1.0"
description = "Hackathon MVP for conversations attached to ArUco-marked objects"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "numpy==2.1.3",
  "opencv-contrib-python-headless==4.10.0.84",
  "pydantic==2.10.4",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
